<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Email Classifier</title>
    <link href="/static/css/inbox.css" rel="stylesheet"/>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h2>Inbox</h2>
        <div id="emailList" class="email-list"></div>
    </aside>

    <main class="viewer">
        <div class="toolbar">
            <h2 id="subject"></h2>
        </div>

        <div class="meta">
            <p>
                <strong>From:</strong>
                <span id="from"></span>
            </p>
            <p>
                <strong>Date:</strong>
                <span id="date"></span>
            </p>
        </div>

        <div class="analysis">
            <div id="prediction" class="badge">
                Loading...
            </div>
            <div id="triggerWords"></div>
        </div>

        <hr>
        <div id="body" class="body"></div>
    </main>
</div>
<script src="/static/js/inbox.js"></script>
</body>
</html>
